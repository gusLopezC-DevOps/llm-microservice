apiVersion: apps/v1
kind: Deployment
metadata:
  name: managed-llm-service
  namespace: managed-llm-service
  labels:
    app: managed-llm-service
    backstage.io/kubernetes-id: managed-llm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: managed-llm-service
  template:
    metadata:
      labels:
        app: managed-llm-service
        backstage.io/kubernetes-id: managed-llm-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: python:3.12-slim
          command: ["python", "/app/server.py"]
          env:
            - name: ROUTER_ENDPOINT
              value: "http://finops-arbitrage-router.finops-arbitrage-router.svc.cluster.local:8080"
            - name: ROUTER_PRIORITY
              value: "max-performance"
            - name: LOCAL_MODEL
              value: "llama3.2:1b"
            - name: SQLITE_PATH
              value: "/data/managed-llm-service.db"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: app
          configMap:
            name: managed-llm-service-config
        - name: data
          emptyDir: {}
