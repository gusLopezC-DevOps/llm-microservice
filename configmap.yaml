apiVersion: v1
kind: ConfigMap
metadata:
  name: managed-llm-service-config
  namespace: managed-llm-service
  labels:
    app: managed-llm-service
    backstage.io/kubernetes-id: managed-llm-service
data:
  server.py: |
    import json, os, sqlite3, urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    ROUTER = os.environ.get(
        "ROUTER_ENDPOINT",
        "http://finops-arbitrage-router.finops-arbitrage-router.svc.cluster.local:8080",
    )
    PRIORITY = os.environ.get("ROUTER_PRIORITY", "cost-optimized")
    LOCAL_MODEL = os.environ.get("LOCAL_MODEL", "llama3.1:8b")
    DB = os.environ.get("SQLITE_PATH", "/data/llm-microservice.db")

    def route(payload):
        headers = {"Content-Type": "application/json", "X-Router-Priority": PRIORITY}
        req = urllib.request.Request(
            ROUTER + "/v1/chat/completions",
            data=json.dumps(payload).encode(),
            headers=headers,
        )
        with urllib.request.urlopen(req, timeout=120) as resp:
            return self._send(resp.status, resp.read())

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            payload = json.loads(self.rfile.read(length) or b"{}")
            endpoint = ROUTER + "/v1/chat/completions"
            headers = {"Content-Type": "application/json", "X-Router-Priority": PRIORITY}
            req = urllib.request.Request(
                endpoint, data=json.dumps(payload).encode(), headers=headers
            )
            with urllib.request.urlopen(req, timeout=120) as resp:
                body = resp.read()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            self.send_response(404)
            self.end_headers()

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
  config.yaml: |
    router:
      endpoint: http://finops-arbitrage-router.finops-arbitrage-router.svc.cluster.local:8080
      priority: max-performance
    local-model: llama3.2:1b
    database:
      path: /data/managed-llm-service.db
